; PartyInventory settings. Key values are DirectInput scan codes (decimal or 0x hex).
; 0x22 = G, 0x23 = H. Full list: https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes

[Controls]
; Look at another player and press this to open their inventory.
OpenKey=0x22
; Press this to allow or forbid other players from opening YOUR inventory.
ToggleAccessKey=0x23

[Access]
; 1 = other players can open your inventory. The toggle key changes and saves this. Off by default.
AllowOthers=0
; 1 = you can only open players who have turned AllowOthers on. Keep this on unless you know why not.
RequireConsent=1
; Which menu to open: 0 loot, 1 steal, 2 pickpocket, 3 NPC (take and give). 3 is recommended.
Mode=3
; Maximum distance (game units) to the other player when opening. Vanilla activation reach is about 150-250.
MaxDistance=350

[General]
Notifications=1
Debug=0
